name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.6.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on main
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:release "$RELEASE_TAG"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec turbo run test --concurrency=1 -- --maxWorkers=4
      - run: pnpm check:packages

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - name: Require npm publishing credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo 'NPM_TOKEN is missing. No packages or GitHub release will be published.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to still identify the validated commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release "$RELEASE_TAG"
      - run: pnpm --filter './packages/**' build
      - name: Publish missing public packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/publish-packages.mjs
      - name: Verify the public npm install before announcing the release
        run: node scripts/release/verify-published.mjs "${RELEASE_TAG#v}"
      - name: Publish GitHub release with reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
