name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: CLI smoke (mock provider, no credentials)
        run: |
          export ADPORT_HOME="$(mktemp -d)"
          node packages/cli/dist/index.js tools list
          node packages/cli/dist/index.js accounts --json
          node packages/cli/dist/index.js report --metrics spend,clicks,roas
          node packages/cli/dist/index.js audit run
