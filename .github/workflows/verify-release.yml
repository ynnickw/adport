name: Verify published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published adport version to install from npm
        required: true
        default: "0.6.0"
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and smoke-test public registry packages
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export ADPORT_HOME="$(mktemp -d)"
          npm install --global "adport@$RELEASE_VERSION" --userconfig=/dev/null
          test "$(adport --version)" = "$RELEASE_VERSION"
          adport tools list
          if adport accounts --json; then
            echo "Expected account reads to fail without credentials"
            exit 1
          fi
          adport --demo accounts --json
