name: Verify published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install from npm (for example 0.6.2 or 0.7.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify a clean public registry installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/verify-published.mjs "$RELEASE_VERSION"
